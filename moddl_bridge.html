<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; media-src 'self'; connect-src https://api.deadlock-api.com https://deadlock.wiki https://translate.googleapis.com;">
<title>MODDL:INIT</title>
</head>
<body>
<!--
  Служебная страница moDL+. Скрытая HTML-панель игры открывает её, передаёт
  команды в адресе после "#", а ответ получает через заголовок страницы.
  1) Хранит настройки в localStorage — на компьютере игрока, никуда не отправляя.
  2) (Раньше проигрывал озвучку moDL+ — она удалена, список звуков пуст.)
  3) Для функции «Профили игроков» запрашивает у api.deadlock-api.com публичную статистику игрока,
     чей профиль открыт.
  4) Для функции «Изменения героя» читает с deadlock.wiki историю изменений героев (страницы
     «<Герой>/Update history») — только обновления новее тех, что уже есть в моде,
     и переводит тексты изменений (патчноуты Valve — только английские) Google Переводчиком;
     переводы запоминает в localStorage, чтобы не переводить одно и то же снова.
  Других адресов браузер этой странице открывать не даст (см. connect-src выше).
-->
<script>
// Разбор страниц вики — точная копия tools/hero_changes_parse.js (проверяет tests/ui_smoke.test.js).
// Разбор страницы «<Герой>/Update history» с deadlock.wiki (вики-разметка) в строки истории.
// Один и тот же код — при сборке (tools/gen_hero_changes.js) и на странице-хранилище
// (bridge/moddl_bridge.html, свежие обновления прямо в игре), поэтому без новых возможностей JS.
// Результат: [["2026-10-30", ["строка", …]], …] — новые даты первыми. Пометки в строке:
// ⟦Способность⟧, ⟪u⟫ — нет в патчноутах (нашли сами), ⟪+⟫ / ⟪-⟫ — усиление / ослабление.
(function (root) {
    "use strict";
    var MONTHS = { january: 1, february: 2, march: 3, april: 4, may: 5, june: 6, july: 7, august: 8, september: 9, october: 10, november: 11, december: 12 };
    var pad = function (n) { return (n < 10 ? "0" : "") + n; };

    var cleanLine = function (s) {
        return String(s)
            .replace(/<ref[\s\S]*?(<\/ref>|\/>)/gi, "")
            .replace(/<br\s*\/?>/gi, " ")
            .replace(/<[^>]+>/g, "")
            .replace(/\{\{\s*AbilityIcon\s*\|\s*([^|}]+)[^}]*\}\}/gi, function (_, n) { return "⟦" + n.trim() + "⟧"; })
            .replace(/\{\{\s*Undocumented\s*\}\}/gi, "⟪u⟫")
            .replace(/'''\(Undocumented\)'''/gi, "⟪u⟫")
            .replace(/\{\{\s*Change\s*\|\s*buff\s*\}\}/gi, "⟪+⟫")
            .replace(/\{\{\s*Change\s*\|\s*nerf\s*\}\}/gi, "⟪-⟫")
            .replace(/\{\{\s*Change\s*\|[^}]*\}\}/gi, "")
            .replace(/\{\{\s*sic\s*\}\}/gi, "")
            .replace(/\{\{\s*(?:ItemIcon|HeroIcon|EntityIcon|PageRef)\s*\|\s*([^|}]+)[^}]*\}\}/gi, function (_, n) { return n.trim(); })
            .replace(/\{\{[^{}]*\}\}/g, "")
            .replace(/\[\[(?:Category|File|Image):[^\]]*\]\]/gi, "")
            .replace(/\[\[[^\]|]*\|([^\]]*)\]\]/g, "$1")
            .replace(/\[\[([^\]]*)\]\]/g, "$1")
            .replace(/'''?/g, "")
            .replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").replace(/&quot;/g, "\"").replace(/&#39;/g, "'").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
            .replace(/\s+/g, " ")
            .trim();
    };

    var parsePage = function (text) {
        var out = [];
        var parts = String(text || "").split(/\{\{\s*Update history table\/row/i).slice(1);
        for (var i = 0; i < parts.length; i++) {
            var p = parts[i];
            var d = /\{\{\s*Update[ _]link\s*\|\s*([A-Za-z]+)\s*\|\s*(\d{1,2})\s*\|\s*(\d{4})/.exec(p);
            if (!d || !MONTHS[d[1].toLowerCase()]) continue;
            var date = d[3] + "-" + pad(MONTHS[d[1].toLowerCase()]) + "-" + pad(parseInt(d[2], 10));
            var at = p.search(/\|\s*changes\s*=/i);
            if (at < 0) continue;
            var lines = [];
            var rows = p.slice(at).split(/\r?\n/);
            for (var k = 0; k < rows.length; k++) {
                var m = /^\s*(\*+)\s*(.*)$/.exec(rows[k]);
                if (!m) continue;
                var t = cleanLine(m[2]);
                // Строка-заголовок вроде «Street Brawl:» без текста под ней не нужна; вложенные — с отступом.
                if (!t || /^⟪u⟫$/.test(t)) continue;
                lines.push((m[1].length > 1 ? "  " : "") + t);
            }
            if (lines.length) out.push([date, lines]);
        }
        out.sort(function (a, b) { return a[0] < b[0] ? 1 : a[0] > b[0] ? -1 : 0; });
        return out;
    };

    var api = { parsePage: parsePage, cleanLine: cleanLine };
    if (typeof module !== "undefined" && module.exports) module.exports = api;
    else root.ModdlHeroChanges = api;
})(this);
</script>
<script>
(function () {
    "use strict";
    var KEY = "moddl_settings";
    var SOUNDS = [];   // своей озвучки у moDL+ больше нет
    var audio = {};

    function reply(id, op, data) {
        document.title = "MODDL:RES:" + id + ":" + JSON.stringify({ op: op, data: data });
    }

    // Заранее загружаем звуки, чтобы они играли без задержки.
    SOUNDS.forEach(function (name) {
        try { var a = new Audio("sounds/" + name + ".mp3"); a.preload = "auto"; audio[name] = a; } catch (e) {}
    });

    function play(name, vol) {
        if (SOUNDS.indexOf(name) < 0) return "unknown";
        try {
            var a = audio[name] ? audio[name].cloneNode() : new Audio("sounds/" + name + ".mp3");
            a.volume = Math.max(0, Math.min(1, Number(vol)));
            var p = a.play();
            if (p && p.catch) p.catch(function (e) { document.title = "MODDL:AUDIOERR:" + (e && e.name ? e.name : e); });
            return "ok";
        } catch (e) { return "error " + e; }
    }

    var storageOk = true;
    try {
        localStorage.setItem("__moddl_probe__", "1");
        localStorage.removeItem("__moddl_probe__");
    } catch (e) { storageOk = false; }

    // Заголовок страницы короткий (около 4000 символов), поэтому только нужные числа:
    // герои [id, матчи, победы, время (мин), У, С, П, добивания, отказы, души (сотни), урон (сотни), урон целям (сотни), точность %, в голову %,
    //        лучший в матче (раз), матчей с оценкой (0 = все), получено урона (сотни), усиления, первое усиление (десятки с)],
    // матчи [герой, 0, исход, длительность, У, С, П, души, номер матча] — по 8 на страницу.
    function R(n) { return Math.round(n || 0); }
    var PAGE = 8, history = {};
    // Сводка 20 последних матчей: [победы, матчей, У, С, П, души (средние), лучшие души, герой лучшего, начало последнего, серия (+победы / -поражения)].
    function summary(list) {
        var l = list.slice(0, 20), n = l.length, s = [0, n, 0, 0, 0, 0, 0, 0, n ? l[0].start_time : 0, 0];
        l.forEach(function (x) {
            if (x.player_match_outcome === 1) s[0]++;
            s[2] += x.player_kills || 0; s[3] += x.player_deaths || 0; s[4] += x.player_assists || 0; s[5] += x.net_worth || 0;
            if ((x.net_worth || 0) > s[6]) { s[6] = x.net_worth; s[7] = x.hero_id; }
        });
        for (var i = 2; i < 6; i++) s[i] = n ? Math.round(s[i] * 10 / n) / 10 : 0;
        for (var j = 0; j < n; j++) {
            var w = l[j].player_match_outcome === 1;
            if (j && w !== (l[0].player_match_outcome === 1)) break;
            s[9] += w ? 1 : -1;
        }
        return s;
    }
    function row(x) { return [x.hero_id, 0, x.player_match_outcome, x.match_duration_s, x.player_kills, x.player_deaths, x.player_assists, x.net_worth, String(x.match_id)]; }
    function sorted(list) { return list.slice().sort(function (p, q) { return q.start_time - p.start_time; }); }
    // Страница матчей игрока (все герои или один). История хранится здесь: в заголовок вся не влезет.
    function matches(acc, page, hero) {
        function send(list) {
            var f = hero ? list.filter(function (x) { return x.hero_id === hero; }) : list;
            document.title = "MODDL:PFM:" + acc + ":" + JSON.stringify({ m: f.slice(page * PAGE, page * PAGE + PAGE).map(row), n: f.length, p: page, hero: hero, s: summary(f) });
        }
        if (history[acc]) { send(history[acc]); return; }
        fetch("https://api.deadlock-api.com/v1/players/" + acc + "/match-history").then(function (r) {
            if (!r.ok) throw "HTTP " + r.status;
            return r.json();
        }).then(function (list) { history[acc] = sorted(list); send(history[acc]); }).catch(function (e) {
            document.title = "MODDL:PF:" + acc + ":ERR:" + e;
        });
    }
    function profile(acc) {
        function get(path) {
            return fetch("https://api.deadlock-api.com/v1/players/" + acc + path).then(function (r) {
                if (!r.ok) throw "HTTP " + r.status;
                return r.json();
            });
        }
        Promise.all([get("/hero-stats"), get("/match-history")]).then(function (v) {
            var heroes = v[0].map(function (x) {
                var m = (x.time_played || 0) / 60;
                return [x.hero_id, x.matches_played, x.wins, R(m), x.kills, x.deaths, x.assists,
                    R(x.last_hits_per_min * m), R(x.denies_per_min * m), R(x.networth_per_min * m / 100),
                    R(x.total_player_damage / 100), R(x.obj_damage_per_min * m / 100), R(x.accuracy * 100), R(x.crit_shot_rate * 100),
                    (x.mvp_rank_counts || [0])[0], x.mvp_rated_matches === x.matches_played ? 0 : (x.mvp_rated_matches || 0), R(x.damage_taken_per_min * m / 100), x.permanent_buffs || 0, R(x.avg_first_permanent_buff_time_s / 10)];
            });
            history[acc] = sorted(v[1]);
            document.title = "MODDL:PF:" + acc + ":" + JSON.stringify({ h: heroes, m: history[acc].slice(0, PAGE).map(row), n: v[1].length, s: summary(history[acc]) });
        }).catch(function (e) {
            document.title = "MODDL:PF:" + acc + ":ERR:" + e;
        });
    }

    // «Изменения героя»: свежие обновления с вики. Ответ длинный — частями по 1800 символов:
    // MODDL:HC2:<номер запроса>:<откуда следующий кусок, 0 — конец>:<кусок>; следующий кусок — команда hcp.
    // Смещение называет страница: заголовок схлопывает двойные пробелы, и считать его по длине нельзя.
    var HC_API = "https://deadlock.wiki/api.php?action=query&prop=revisions&rvprop=content&rvslots=main&redirects=1&format=json&formatversion=2&origin=*&titles=";
    var hcText = "";
    function hcSend(id, off) {
        document.title = "MODDL:HC2:" + id + ":" + (off + 1800 < hcText.length ? off + 1800 : 0) + ":" + hcText.substr(off, 1800);
    }
    function heroChanges(id, since, heroes) {
        var byTitle = {}, titles = [];
        heroes.forEach(function (h) { if (h && /^\d+$/.test(String(h[0])) && typeof h[1] === "string") { byTitle[h[1] + "/Update history"] = h[0]; titles.push(h[1] + "/Update history"); } });
        var parts = [];
        for (var i = 0; i < titles.length; i += 25) parts.push(titles.slice(i, i + 25));
        Promise.all(parts.map(function (p) {
            return fetch(HC_API + p.map(encodeURIComponent).join("|")).then(function (r) {
                if (!r.ok) throw "HTTP " + r.status;
                return r.json();
            });
        })).then(function (all) {
            var out = {};
            all.forEach(function (j) {
                var redirect = {};
                ((j.query && j.query.redirects) || []).forEach(function (x) { redirect[x.to] = x.from; });
                ((j.query && j.query.pages) || []).forEach(function (pg) {
                    var hero = byTitle[pg.title] || byTitle[redirect[pg.title]];
                    if (!hero || pg.missing || !pg.revisions) return;
                    var rows = ModdlHeroChanges.parsePage(pg.revisions[0].slots.main.content).filter(function (r) { return r[0] > since; });
                    if (rows.length) out[hero] = rows;
                });
            });
            hcText = JSON.stringify({ heroes: out });
            hcSend(id, 0);
        }).catch(function (e) {
            hcText = JSON.stringify({ err: String(e) });
            hcSend(id, 0);
        });
    }

    // «Изменения героя»: машинный перевод строк. Ответ — частями, как у «hc»: MODDL:TR2:<номер>:<откуда дальше|0>:<кусок>.
    var TR_API = "https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl=en&tl=";
    var trText = "";
    function trSend(id, off) {
        document.title = "MODDL:TR2:" + id + ":" + (off + 1800 < trText.length ? off + 1800 : 0) + ":" + trText.substr(off, 1800);
    }
    function trCache(lang) {
        var c = {};
        try { c = JSON.parse(localStorage.getItem("moddl_tr_" + lang) || "{}") || {}; } catch (e) { c = {}; }
        return c;
    }
    // Один запрос — несколько строк через перевод строки; ответ Google — куски [перевод, оригинал, …].
    function googleText(lang, text) {
        return fetch(TR_API + encodeURIComponent(lang) + "&q=" + encodeURIComponent(text)).then(function (r) {
            if (!r.ok) throw "HTTP " + r.status;
            return r.json();
        }).then(function (j) {
            // Без невидимых символов (переводчик вставляет \u200b).
            return ((j && j[0]) || []).map(function (seg) { return seg && seg[0] ? seg[0] : ""; }).join("").replace(/[\u200b\u200c\u200d\ufeff]/g, "");
        });
    }
    function translateLines(id, lang, lines) {
        var cache = trCache(lang), need = lines.filter(function (l, i) { return !cache[l] && lines.indexOf(l) === i; });
        var joined = need.join("\n");
        var done = function () {
            try { localStorage.setItem("moddl_tr_" + lang, JSON.stringify(cache)); } catch (e) {}
            trText = JSON.stringify({ t: lines.map(function (l) { return cache[l] || ""; }) });
            trSend(id, 0);
        };
        if (!need.length) { done(); return; }
        googleText(lang, joined).then(function (out) {
            var parts = out.split("\n");
            // Строк столько же — раскладываем; иначе (переводчик склеил строки) — переводим по одной.
            if (parts.length === need.length) { need.forEach(function (l, i) { cache[l] = parts[i].trim(); }); done(); return; }
            return Promise.all(need.map(function (l) {
                return googleText(lang, l).then(function (t) { cache[l] = t.trim(); }, function () {});
            })).then(done);
        }).catch(function (e) {
            trText = JSON.stringify({ err: String(e) });
            trSend(id, 0);
        });
    }

    // «Рейтинг»: ранговые матчи игрока (новые первыми), его ранг и даты сезона с deadlock-api.com.
    // Ответ — частями, как у «hc»: MODDL:RK2:<номер>:<откуда дальше|0>:<кусок>; следующий кусок — команда rkp.
    // Матч: [номер, начало, герой, победа 1/0, очки ранга за матч, убийства, смерти, помощь, калибровка 1/0, длительность].
    // Сезон: { n — название, a/b — начало и конец, x — цена подрангов, g — очки за матч, c — калибровочных матчей }.
    var rkText = "";
    function rkSend(id, off) {
        document.title = "MODDL:RK2:" + id + ":" + (off + 1800 < rkText.length ? off + 1800 : 0) + ":" + rkText.substr(off, 1800);
    }
    function ranked(id, acc) {
        var API = "https://api.deadlock-api.com/v1/";
        function get(url) {
            return fetch(url).then(function (r) {
                if (!r.ok) throw "HTTP " + r.status;
                return r.json();
            });
        }
        Promise.all([
            get(API + "players/" + acc + "/match-history"),
            get(API + "players/" + acc + "/rank").catch(function () { return null; }),
            get(API + "assets/ranked-seasons").catch(function () { return []; })
        ]).then(function (v) {
            var m = (v[0] || []).filter(function (x) { return x.match_mode === 4; }).sort(function (a, b) { return b.start_time - a.start_time; }).slice(0, 600).map(function (x) {
                return [x.match_id, x.start_time, x.hero_id, x.match_result === x.player_team ? 1 : 0, x.ranked_delta || 0,
                    x.player_kills || 0, x.player_deaths || 0, x.player_assists || 0, x.ranked_calibration_match ? 1 : 0, x.match_duration_s || 0];
            });
            var s = [], g = 0, c = 0;
            (v[2] || []).forEach(function (se) {
                // Правила сезона: цена подрангов (sub_rank_xp), очки за матч, число калибровочных матчей.
                var xp = se.rank_info && se.rank_info[0] && se.rank_info[0].sub_rank_xp;
                (se.intervals || []).forEach(function (iv) {
                    s.push({ n: se.name || "", a: iv.start_timestamp, b: iv.end_timestamp, x: Array.isArray(xp) ? xp : null,
                        g: se.base_win_loss_point_grant || 0, c: se.calibration_matches || 0 });
                });
                if (se.base_win_loss_point_grant) g = se.base_win_loss_point_grant;
                if (se.calibration_matches) c = se.calibration_matches;
            });
            var lm = v[1] && v[1].last_match;
            var r = lm ? { b: v[1].badge || 0, f: lm.player_rank_final_flat_progress, at: lm.start_time } : null;
            rkText = JSON.stringify({ m: m, s: s, r: r, g: g, c: c });
            rkSend(id, 0);
        }).catch(function (e) {
            rkText = JSON.stringify({ err: String(e) });
            rkSend(id, 0);
        });
    }

    function handle() {
        var raw = location.hash ? location.hash.slice(1) : "";
        if (!raw) return;
        var msg;
        try { msg = JSON.parse(decodeURIComponent(raw)); } catch (e) { return; }
        if (!msg || typeof msg.id !== "string" || !/^\d+$/.test(msg.id)) return;
        if (msg.op === "profile") {
            if (/^\d+$/.test(String(msg.acc))) profile(String(msg.acc));
        } else if (msg.op === "matches") {
            if (/^\d+$/.test(String(msg.acc))) matches(String(msg.acc), Math.max(0, Number(msg.page) || 0), Number(msg.hero) || 0);
        } else if (msg.op === "hc") {
            if (Array.isArray(msg.heroes)) heroChanges(msg.id, /^\d{4}-\d\d-\d\d$/.test(String(msg.since)) ? String(msg.since) : "", msg.heroes);
        } else if (msg.op === "tr") {
            if (Array.isArray(msg.q) && /^[a-zA-Z-]{2,5}$/.test(String(msg.lang))) translateLines(msg.id, String(msg.lang), msg.q.map(String).slice(0, 80));
        } else if (msg.op === "trp") {
            trSend(msg.id, Math.max(0, Number(msg.off) || 0));
        } else if (msg.op === "rk") {
            if (/^\d+$/.test(String(msg.acc))) ranked(msg.id, String(msg.acc));
        } else if (msg.op === "rkp") {
            rkSend(msg.id, Math.max(0, Number(msg.off) || 0));
        } else if (msg.op === "hcp") {
            hcSend(msg.id, Math.max(0, Number(msg.off) || 0));
        } else if (msg.op === "play") {
            reply(msg.id, "play", play(String(msg.name), msg.vol));
        } else if (!storageOk) {
            reply(msg.id, msg.op, null);
        } else if (msg.op === "loadp") {
            // Настройки частями: заголовок страницы ограничен, а со своими сетками героев настройки большие.
            var raw = localStorage.getItem(KEY) || "null", off = Math.max(0, Number(msg.off) || 0);
            // next — откуда следующий кусок (заголовок схлопывает двойные пробелы — по длине полученного считать нельзя).
            document.title = "MODDL:RES:" + msg.id + ":" + JSON.stringify({ op: "loadp", s: raw.substr(off, 1800), more: off + 1800 < raw.length, next: off + 1800 });
        } else if (msg.op === "load") {
            var data = null;
            try { data = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { data = null; }
            reply(msg.id, "load", data);
        } else if (msg.op === "save" && msg.data && typeof msg.data === "object") {
            localStorage.setItem(KEY, JSON.stringify(msg.data));
            reply(msg.id, "save", true);
        }
    }

    window.addEventListener("hashchange", handle);
    document.title = storageOk ? "MODDL:READY" : "MODDL:ERROR:localStorage";
    handle();
})();
</script>
</body>
</html>
